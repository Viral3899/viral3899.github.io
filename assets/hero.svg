<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-label="Viral Sherathiya AI ML Engineer animated GitHub profile hero">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050816"/><stop offset=".52" stop-color="#0d1228"/><stop offset="1" stop-color="#1a0b35"/></linearGradient>
<linearGradient id="accent" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#60a5fa"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
<radialGradient id="orb"><stop stop-color="#38bdf8" stop-opacity=".35"/><stop offset=".7" stop-color="#6366f1" stop-opacity=".08"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#64748b" stroke-opacity=".13"/></pattern>
<filter id="glow"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1600" height="520" rx="30" fill="url(#bg)"/><rect width="1600" height="520" rx="30" fill="url(#grid)"/>
<circle cx="1320" cy="105" r="300" fill="url(#orb)"/><circle cx="150" cy="480" r="250" fill="#7c3aed" opacity=".08"/>
<g fill="#67e8f9"><circle cx="1030" cy="70" r="3"><animate attributeName="cy" values="70;105;70" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values=".25;1;.25" dur="3s" repeatCount="indefinite"/></circle><circle cx="1190" cy="360" r="3"><animate attributeName="cy" values="360;325;360" dur="4s" repeatCount="indefinite"/></circle><circle cx="1460" cy="250" r="4"><animate attributeName="r" values="3;7;3" dur="2.5s" repeatCount="indefinite"/></circle></g>
<g transform="translate(85 82)"><text x="0" y="24" fill="#67e8f9" font-family="monospace" font-size="18" font-weight="700" letter-spacing="5">AI / ML ENGINEER</text><rect x="0" y="48" width="94" height="4" rx="2" fill="url(#accent)"><animate attributeName="width" values="94;170;94" dur="3s" repeatCount="indefinite"/></rect><text x="0" y="125" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="64" font-weight="800">Viral Sherathiya</text><text x="0" y="173" fill="#cbd5e1" font-family="Arial,Helvetica,sans-serif" font-size="25">Generative AI  •  Agentic AI  •  RAG  •  Production ML</text><text x="0" y="216" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="18">Building AI systems that reason, retrieve, use tools and ship.</text>
<g transform="translate(0 268)"><rect width="700" height="62" rx="14" fill="#070b16" stroke="#334155"/><circle cx="23" cy="22" r="5" fill="#475569"/><circle cx="41" cy="22" r="5" fill="#475569"/><circle cx="59" cy="22" r="5" fill="#475569"/><text x="24" y="48" fill="#67e8f9" font-family="monospace" font-size="16">$ build --agents --rag --tools --production</text><rect x="552" y="34" width="9" height="18" fill="#a78bfa"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect></g></g>
<g transform="translate(1245 255)"><ellipse rx="205" ry="82" fill="none" stroke="#38bdf8" stroke-opacity=".42" stroke-width="2"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/></ellipse><ellipse rx="205" ry="82" fill="none" stroke="#a78bfa" stroke-opacity=".35" stroke-width="2" transform="rotate(60)"><animateTransform attributeName="transform" type="rotate" from="60" to="420" dur="24s" repeatCount="indefinite"/></ellipse><ellipse rx="205" ry="82" fill="none" stroke="#22d3ee" stroke-opacity=".28" stroke-width="2" transform="rotate(-60)"><animateTransform attributeName="transform" type="rotate" from="-60" to="-420" dur="28s" repeatCount="indefinite"/></ellipse>
<circle r="92" fill="#0b1120" stroke="url(#accent)" stroke-width="4" filter="url(#glow)"/><circle r="70" fill="#111827"/><path d="M-42 -8 Q0 -49 42 -8 L34 34 Q0 62 -34 34Z" fill="#172033" stroke="#334155"/><circle cx="-20" cy="4" r="7" fill="#67e8f9"><animate attributeName="opacity" values=".35;1;.35" dur="1.8s" repeatCount="indefinite"/></circle><circle cx="20" cy="4" r="7" fill="#a78bfa"><animate attributeName="opacity" values="1;.35;1" dur="1.8s" repeatCount="indefinite"/></circle><path d="M-21 27 Q0 40 21 27" fill="none" stroke="#67e8f9" stroke-width="4" stroke-linecap="round"/><text y="-115" text-anchor="middle" fill="#e0f2fe" font-family="monospace" font-size="16" letter-spacing="3">AI CORE</text>
<g font-family="monospace" font-size="15" text-anchor="middle"><g transform="translate(0 -160)"><circle r="30" fill="#0f172a" stroke="#38bdf8"/><text y="5" fill="#e0f2fe">LLM</text></g><g transform="translate(155 -80)"><circle r="30" fill="#0f172a" stroke="#a78bfa"/><text y="5" fill="#e0f2fe">RAG</text></g><g transform="translate(155 80)"><circle r="30" fill="#0f172a" stroke="#38bdf8"/><text y="5" fill="#e0f2fe">MCP</text></g><g transform="translate(0 160)"><circle r="30" fill="#0f172a" stroke="#a78bfa"/><text y="5" fill="#e0f2fe">ML</text></g><g transform="translate(-155 80)"><circle r="30" fill="#0f172a" stroke="#38bdf8"/><text y="5" fill="#e0f2fe">AWS</text></g><g transform="translate(-155 -80)"><circle r="30" fill="#0f172a" stroke="#a78bfa"/><text y="5" fill="#e0f2fe">API</text></g></g><circle cx="-205" cy="0" r="6" fill="#67e8f9" filter="url(#glow)"><animateMotion dur="4s" repeatCount="indefinite" path="M 0,0 C 110,-100 210,-55 310,0 C 210,55 110,100 0,0"/></circle></g>
<text x="85" y="455" fill="#64748b" font-family="monospace" font-size="13" letter-spacing="2">PYTHON  •  LANGCHAIN  •  LANGGRAPH  •  FASTAPI  •  QDRANT  •  DOCKER  •  AWS</text>
</svg>
